/* =========================================
   FUNGSI TERJEMAHAN
========================================= */

function teks(key){
  return bahasa[bahasaAktif][key] || bahasa.id[key] || key;
}

function namaTerjemahan(nama){
  if(bahasaAktif === "id") return nama;

  return (
    terjemahanNama[bahasaAktif] &&
    terjemahanNama[bahasaAktif][nama]
  ) || nama;
}

function descTerjemahan(nama, desc){
  if(bahasaAktif === "id") return desc;

  return (
    terjemahanDesc[bahasaAktif] &&
    terjemahanDesc[bahasaAktif][nama]
  ) || desc;
}

function aksesTerjemahan(teksAkses){

  if(bahasaAktif === "id")
    return teksAkses;

  return (
    terjemahanAkses[bahasaAktif] &&
    terjemahanAkses[bahasaAktif][teksAkses]
  ) || teksAkses;
}

function dataBahasa(l){

  if(bahasaAktif === "id")
    return l;

  return {
    ...l,

    nama:
      namaTerjemahan(l.nama),

    desc:
      descTerjemahan(
        l.nama,
        l.desc
      ),

    akses:{
      jalan:
        aksesTerjemahan(l.akses.jalan),

      motor:
        aksesTerjemahan(l.akses.motor),

      mobil:
        aksesTerjemahan(l.akses.mobil),

      catatan:
        aksesTerjemahan(l.akses.catatan)
    }
  };
}


/* =========================================
   RATING
========================================= */

function buatRating(rating) {

  const penuh = Math.floor(rating);
  const kosong = 5 - penuh;

  let bintang = "";

  for(let i=0;i<penuh;i++){
    bintang += "★";
  }

  for(let i=0;i<kosong;i++){
    bintang += "☆";
  }

  return `
    <div class="rating">
      <span class="bintang">${bintang}</span>
      <b>${rating}/5</b>
    </div>
  `;
}

/* =========================================
   FORMAT RUPIAH
========================================= */

function formatRupiah(angka) {

  return new Intl.NumberFormat(
    'id-ID',
    {
      style:'currency',
      currency:'IDR',
      maximumFractionDigits:0
    }
  ).format(angka);

}


/* =========================================
   ESTIMASI GRAB MOTOR
========================================= */

function estimasiGrabMotor(jarakKm) {

  const tarifAwal = 9000;
  const tarifPerKm = 3000;

  let harga =
    tarifAwal +
    (jarakKm * tarifPerKm);

  return Math.ceil(harga / 1000) * 1000;
}


/* =========================================
   ESTIMASI GRAB MOBIL
========================================= */

function estimasiGrabMobil(jarakKm) {

  const tarifAwal = 15000;
  const tarifPerKm = 5000;

  let harga =
    tarifAwal +
    (jarakKm * tarifPerKm);

  return Math.ceil(harga / 1000) * 1000;
}


/* =========================================
   RUTE
========================================= */

let markers = [];
let routeLine = null;

function tampilkanRute(
  tujuanLat,
  tujuanLng,
  namaTempat,
  biaya,
  akses
) {

  tujuanAktif = {
    lat:tujuanLat,
    lng:tujuanLng,
    nama:namaTempat,
    biaya:biaya,
    akses:akses
  };

  if(routeLine){
    map.removeLayer(routeLine);
    routeLine = null;
  }

  const infoBox =
    document.getElementById(
      'infoPerjalanan'
    );

  infoBox.style.display = 'block';

  infoBox.innerHTML =
    `<b>${teks("menghitung")}</b>`;

  const url =
    'https://router.project-osrm.org/route/v1/driving/' +
    titikAwal.lng + ',' +
    titikAwal.lat + ';' +
    tujuanLng + ',' +
    tujuanLat +
    '?overview=full&geometries=geojson&steps=false';

  fetch(url)

  .then(res => {

    if(!res.ok){
      throw new Error(
        'Routing error'
      );
    }

    return res.json();

  })

  .then(data => {

    if(
      !data.routes ||
      data.routes.length === 0
    ){

      infoBox.innerHTML =
        `<b>${teks("tidakDitemukan")}</b>`;

      return;
    }

    const rute =
      data.routes[0];

    const koordinat =
      rute.geometry.coordinates.map(
        c => [c[1],c[0]]
      );

    routeLine =
      L.polyline(
        koordinat,
        {
          color:'red',
          weight:5,
          opacity:0.75
        }
      ).addTo(map);

    map.fitBounds(
      routeLine.getBounds(),
      {
        padding:[40,40]
      }
    );

    const jarakKm =
      rute.distance / 1000;

    const jarakTampil =
      jarakKm < 10
      ? jarakKm.toFixed(1)
      : jarakKm.toFixed(0);

    const durasiDasar =
      Math.round(
        rute.duration / 60
      );

    const motorMin =
      Math.max(
        5,
        Math.round(
          durasiDasar * 0.85
        )
      );

    const motorMax =
      Math.max(
        motorMin + 5,
        Math.round(
          durasiDasar * 1.20
        )
      );

    const mobilMin =
      Math.max(
        5,
        Math.round(
          durasiDasar * 0.90
        )
      );

    const mobilMax =
      Math.max(
        mobilMin + 5,
        Math.round(
          durasiDasar * 1.25
        )
      );

    const grabMotor =
      estimasiGrabMotor(jarakKm);

    const grabMobil =
      estimasiGrabMobil(jarakKm);

    infoBox.innerHTML = `

      <b>📍 ${teks("tujuan")} ${namaTempat}</b>

      <div class="baris">
        📏 <b>${teks("jarak")}</b>
        ${jarakTampil} km
      </div>

      <div class="baris">
        🏍️ <b>${teks("motorPribadi")}</b>
        ± ${motorMin}-${motorMax} menit
      </div>

      <div class="baris">
        🚗 <b>${teks("mobilPribadi")}</b>
        ± ${mobilMin}-${mobilMax} menit
      </div>

      <div class="grab-box">

        <b>${teks("estimasiGrab")}</b>

        <div class="baris" style="margin-top:8px;">
          🏍️ <b>${teks("grabMotor")}</b>
        </div>

        <div class="baris">
          💰 <b>${teks("estimasiHarga")}</b>
          ${formatRupiah(grabMotor)}
        </div>

        <div class="baris">
          📏 <b>${teks("jarak")}</b>
          ${jarakTampil} km
        </div>

        <div class="baris">
          ⏱️ <b>${teks("waktu")}</b>
          ± ${motorMin}-${motorMax} menit
        </div>

        <div class="grab-mobil">

          🚗 <b>${teks("grabMobil")}</b>

          <div class="baris">
            💰 <b>${teks("estimasiHarga")}</b>
            ${formatRupiah(grabMobil)}
          </div>

          <div class="baris">
            📏 <b>${teks("jarak")}</b>
            ${jarakTampil} km
          </div>

          <div class="baris">
            ⏱️ <b>${teks("waktu")}</b>
            ± ${mobilMin}-${mobilMax} menit
          </div>

        </div>

        <div class="grab-catatan">
          ${teks("catatanGrab")}
        </div>

      </div>

      ${buatAkses({
        akses: akses
      })}

      <div class="baris">
        💰 <b>${teks("biaya")}</b>
        ${biaya}
      </div>

      <div
      class="baris"
      style="font-size:11px;color:#888;margin-top:8px;">

        ${teks("catatanRute")}

      </div>

    `;

  })

  .catch(err => {

    console.log(err);

    infoBox.innerHTML = `

      <b>${teks("gagal")}</b>

      <div class="baris">
        ${teks("coba")}
      </div>

      ${buatAkses({
        akses: akses
      })}

    `;

  });

}


/* =========================================
   RENDER PETA
========================================= */

function renderPeta(data) {

  dataSedangTampil = data;

  markers.forEach(
    m => map.removeLayer(m)
  );

  markers = [];

  const list =
    document.getElementById('list');

  list.innerHTML = '';

  data.forEach(original => {

    const l = dataBahasa(original);

    const marker =
      L.marker(
        [l.lat,l.lng],
        {
          icon:
            ikonKategori[l.kategori]
        }
      ).addTo(map);

    let media = `
      <div class="media-container">
    `;

    if(l.foto){

      media += `
        <img
        src="${l.foto}"
        alt="${l.nama}">
      `;

    }

    if(l.video){

      media += `
        <iframe
        src="${l.video}"
        allowfullscreen>
        </iframe>
      `;

    }

    media += `</div>`;

    const popup = `

      <b>${l.nama}</b>

      <br><br>

      ${l.desc}

      ${buatRating(l.rating)}

      <div class="jam-buka">
        🕐 <b>${teks("jam")}</b>
        ${l.jamBuka}
      </div>

      ${buatAkses(l)}

      <br>

      💰 ${l.biaya}

      ${media}

      ${buatTombolLink(l)}

    `;

    marker.bindPopup(popup);

    markers.push(marker);

    marker.on(
      'click',
      function(){

        tampilkanRute(
          l.lat,
          l.lng,
          l.nama,
          l.biaya,
          l.akses
        );

      }
    );

    const div =
      document.createElement('div');

    div.className = 'item';

    div.innerHTML = `

      <b>${l.nama}</b>

      ${buatRating(l.rating)}

      <div class="jam-buka">
        🕐 ${l.jamBuka}
      </div>

      <small>
        ${l.desc}
      </small>

      ${buatAkses(l)}

      <div>
        💰 ${l.biaya}
      </div>

      ${media}

      ${buatTombolLink(l)}

    `;

    div.onclick =
      function(){

        map.flyTo(
          [l.lat,l.lng],
          15
        );

        marker.openPopup();

        tampilkanRute(
          l.lat,
          l.lng,
          l.nama,
          l.biaya,
          l.akses
        );

      };

    list.appendChild(div);

  });

}
